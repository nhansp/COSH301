<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11121a">
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<title>Điều khiển slide</title>
<link rel="stylesheet" href="css/fonts.css">
<style>
:root { --bg: #11121a; --panel: #201d30; --ink: #ece8f0; --muted: #a3a6b3; --coral: #ff8d73; --violet: #9b7bff; --green: #4fd39a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: "Be Vietnam Pro", system-ui, sans-serif; overscroll-behavior: none; }
body { display: grid; gap: 12px; user-select: none; -webkit-user-select: none;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    grid-template-columns: 1.2fr 0.6fr 0.6fr; grid-template-rows: auto auto auto 1fr;
    grid-template-areas: "cur head head" "cur prev next" "cur bp bn" "cur info info"; align-items: start; }
header { grid-area: head; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
#clock { font: 700 38px/1 "Space Grotesk", sans-serif; letter-spacing: -0.02em; }
#pos { font: 500 17px "Space Grotesk", sans-serif; color: var(--muted); text-align: right; }
#pos b { color: var(--ink); }
#dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); margin-right: 8px; }
#dot.on { background: var(--green); }
.view { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.view.cur { grid-area: cur; align-self: center; } .view.prev { grid-area: prev; } .view.next { grid-area: next; }
.view small { font: 500 12px "Space Grotesk", sans-serif; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.view.cur small { color: var(--coral); }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
.view.cur .frame { outline: 3px solid var(--coral); outline-offset: 2px; }
.frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
.frame.none { background: var(--panel); } .frame.none iframe { visibility: hidden; }
.nav { align-self: stretch; border: 0; border-radius: 16px; font: 700 52px/1 "Space Grotesk", sans-serif; color: var(--ink); background: var(--panel); touch-action: manipulation; min-height: 76px; }
.nav.prev { grid-area: bp; } .nav.next { grid-area: bn; background: var(--coral); color: #11121a; }
.nav:active { filter: brightness(1.25); transform: scale(.98); }
#info { grid-area: info; display: flex; flex-direction: column; gap: 10px; min-width: 0; align-self: stretch; }
#who { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; padding: 8px 18px 8px 12px; border-radius: 999px; background: var(--panel); font: 600 18px/1 "Be Vietnam Pro", sans-serif; }
#who i { width: 14px; height: 14px; border-radius: 50%; }
#title { font: 600 17px/1.25 "Be Vietnam Pro", sans-serif; }
#sec { font: 500 13px/1.2 "Be Vietnam Pro", sans-serif; color: var(--muted); }
.row { display: flex; gap: 8px; }
.row button, #fs { flex: 1; border: 1.5px solid #3d3b52; border-radius: 10px; background: none; color: var(--ink); font: 600 14px "Be Vietnam Pro", sans-serif; padding: 10px 6px; touch-action: manipulation; }
#notes { font: 400 14px/1.45 "Be Vietnam Pro", sans-serif; color: var(--muted); white-space: pre-line; overflow: auto; max-height: 26vh; user-select: text; -webkit-user-select: text; }
@media (orientation: portrait) {
    body { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto auto 1fr; grid-template-areas: "head head" "cur cur" "prev next" "bp bn" "info info"; }
    .nav { min-height: 110px; }
}
</style>
</head>
<body>
<header>
    <div id="clock">--:--</div>
    <div id="pos"><span id="dot"></span><b id="slide">–</b> / <span id="total">–</span></div>
</header>
<div class="view cur"><small>đang chiếu</small><div class="frame none" id="f-cur"><iframe tabindex="-1" title="Slide hiện tại"></iframe></div></div>
<div class="view prev"><small>trước</small><div class="frame none" id="f-prev"><iframe tabindex="-1" title="Slide trước"></iframe></div></div>
<div class="view next"><small>tiếp theo</small><div class="frame none" id="f-next"><iframe tabindex="-1" title="Slide tiếp theo"></iframe></div></div>
<button class="nav prev" aria-label="Slide trước">‹</button>
<button class="nav next" aria-label="Slide tiếp theo">›</button>
<div id="info">
    <div id="who" hidden></div>
    <div id="title"></div>
    <div id="sec"></div>
    <div class="row"><button id="replay">Phát lại</button><button id="toggle">Phát / dừng</button><button id="fs">Toàn màn hình</button></div>
    <div id="notes"></div>
</div>
<script src="js/remote.js"></script>
<script>
(function () {
    const $ = id => document.getElementById(id), R = window.Remote;
    function fullscreen(on) {
        const d = document.documentElement;
        if (on && !document.fullscreenElement && d.requestFullscreen)
            d.requestFullscreen({ navigationUI: "hide" }).then(() => screen.orientation?.lock?.("landscape").catch(() => {})).catch(() => {});
        else if (!on && document.fullscreenElement) document.exitFullscreen();
    }
    R.on.state = st => {
        $("slide").textContent = st.slide;
        $("total").textContent = st.total || "–";
        R.frame($("f-cur"), st.slide);
        R.frame($("f-prev"), st.slide > 1 ? st.slide - 1 : 0);
        R.frame($("f-next"), st.slide < st.total ? st.slide + 1 : 0);
        R.chip($("who"), st.speaker);
        $("title").textContent = st.title || "";
        $("sec").textContent = st.nextTitle ? "Tiếp: " + st.nextTitle + (R.speaker(st.nextSpeaker) ? " · " + R.speaker(st.nextSpeaker).short : "") : "";
        $("notes").textContent = st.notes || "";
    };
    document.querySelector(".nav.prev").addEventListener("click", () => { fullscreen(true); R.send("prev"); });
    document.querySelector(".nav.next").addEventListener("click", () => { fullscreen(true); R.send("next"); });
    $("replay").addEventListener("click", () => R.send("replay"));
    $("toggle").addEventListener("click", () => R.send("toggle"));
    $("fs").addEventListener("click", () => fullscreen(!document.fullscreenElement));
    $("clock").addEventListener("click", () => fullscreen(!document.fullscreenElement));
    addEventListener("keydown", e => {
        if (["ArrowRight", "PageDown", " "].includes(e.key)) R.send("next");
        else if (["ArrowLeft", "PageUp"].includes(e.key)) R.send("prev");
    });
    R.connect($("dot"));
    const tick = () => { $("clock").textContent = new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit", hour12: false }); };
    tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
