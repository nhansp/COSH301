services:
  db:
    image: postgres:18.6-alpine3.24
    container_name: cosh301-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-event_ticketing}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: cosh301-api
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-event_ticketing}?sslmode=disable
      FEATURE_PROFILE: ${FEATURE_PROFILE:-sprint2}
      APP_ENV: ${APP_ENV:-development}
      OTP_DEMO: ${OTP_DEMO:-false}
      OTP_APP_DELIVERY: ${OTP_APP_DELIVERY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Empty means "use the profile default"; set on to turn VNPay payment on.
      FEATURE_PAYMENTS: ${FEATURE_PAYMENTS:-}
      # No defaults for credentials: with payments on and these empty, the API refuses to start.
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
      # Assistant (FR-24). Empty LLM_BASE_URL keeps it on keywords only. No default for the key.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    container_name: cosh301-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:80"
    depends_on:
      api:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    container_name: cosh301-tunnel
    restart: unless-stopped
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
      # The tunnel has no dashboard ingress; every request goes to the frontend.
      TUNNEL_URL: http://frontend:80
    depends_on:
      - frontend

volumes:
  pgdata:
