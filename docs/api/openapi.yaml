        - sessionCookie: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTicketRequest'
      responses:
        '200':
          description: Đã hủy và ghi nhật ký
          content:
