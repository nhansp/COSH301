      summary: Đề xuất giá đang chờ duyệt của một sự kiện (FR-22)
      description: |
        Job định giá chạy 5 phút một lần và chỉ tính khu vực có `is_dynamic_pricing_enabled`.
        Mỗi khu vực có tối đa một đề xuất `PENDING`.
        Lần chạy sau cập nhật đề xuất đó bằng số liệu mới.
      operationId: listPriceSuggestions
      x-feature: [organizer_console, dynamic_pricing]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
