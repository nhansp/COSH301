        '404':
          description: '`feature_disabled`, hoặc không có endpoint này khi `APP_ENV=production`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_token
    bearer:
      type: http
      scheme: bearer

  parameters:
    EventRef:
      name: id
      in: path
      required: true
      description: UUID hoặc slug của sự kiện
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 500
    SuggestionId:
      name: id
      in: path
      required: true
      description: UUID của đề xuất giá
      schema:
        type: string
        format: uuid

  responses:
    NotEventOrganizer:
      description: '`forbidden` (sai vai trò) hoặc `not_event_organizer` (không phải BTC của sự kiện)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: Lỗi, mã nằm trong trường `error`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: '`unauthorized`: chưa đăng nhập, phiên hết hạn hoặc tài khoản không còn `ACTIVE`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`forbidden`: vai trò không được phép'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FeatureDisabled:
      description: '`feature_disabled`: cờ tính năng đang tắt'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: seat_not_available
        feature:
          type: string
          description: Chỉ có khi `error = feature_disabled`
          example: seat_hold

    User:
      type: object
      required: [id, phone, email, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          description: Chuỗi rỗng nếu chưa có
        email:
          type: string
          description: Chuỗi rỗng nếu chưa có
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    UserRole:
      type: string
      enum: [CUSTOMER, ORGANIZER, CEO, GATE_STAFF, ADMIN]

    EventStatus:
      type: string
      enum: [DRAFT, ON_SALE, SOLD_OUT, PAUSED, ENDED, CANCELLED]

    EventSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        genre:
          type: string
        city:
          type: string
        imageUrl:
          type: string
        imageCredit:
          type: string
        venue:
          type: string
        address:
          type: string
        date:
          type: string
          format: date-time
          description: Giờ bắt đầu
        endsAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EventStatus'
        priceFrom:
          type: integer
          format: int64
          description: Giá cơ bản thấp nhất trong các khu vực, VND

    EventDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        genre:
          type: string
        imageUrl:
          type: string
        imageCredit:
          type: string
        city:
          type: string
        venueName:
          type: string
        venueAddress:
          type: string
        venueTimezone:
          type: string
          example: Asia/Ho_Chi_Minh
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EventStatus'
        maxTicketsPerUser:
          type: integer
        waitingRoomEnabled:
          type: boolean
        zones:
          type: array
          items:
            $ref: '#/components/schemas/EventZonePrice'

    EventZonePrice:
      type: object
      properties:
        zoneId:
          type: string
          format: uuid
        zoneCode:
          type: string
        zoneName:
          type: string
        floor:
          type: string
        capacity:
          type: integer
        basePrice:
          type: integer
          format: int64
        floorPrice:
          type: integer
          format: int64
        ceilingPrice:
          type: integer
          format: int64
        isDynamicPricingEnabled:
          type: boolean

    SeatMapItem:
      type: object
      properties:
        eventSeatId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        seatId:
          type: string
          format: uuid
        status:
          type: string
          enum: [available, held, sold, selected]
          description: '`selected` là ghế người gọi đang giữ'
        currentPrice:
          type: integer
          format: int64
        row:
          type: string
        number:
          type: string
        label:
          type: string
        x:
          type: number
        y:
          type: number
        zoneId:
          type: string
          format: uuid
        zoneCode:
          type: string
        zoneName:
          type: string
        isMyHold:
          type: boolean

    SeatHold:
      type: object
      required: [holdId, holdToken, seatId, eventId, expiresAt]
      properties:
        holdId:
          type: string
          format: uuid
        holdToken:
          type: string
        seatId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: Giờ hết hạn theo server, dùng cho đồng hồ đếm ngược

    SeatUpdate:
      description: Nội dung `data` của sự kiện SSE `update`
      type: object
      properties:
        type:
          type: string
          enum: [seat_held, seat_released, seat_expired, zone_repriced]
          description: |
            `zone_repriced` không có `seatId` và `status`.
            Trình duyệt tải lại sơ đồ ghế để lấy giá mới.
