openapi: 3.0.3
info:
  title: EventTicketing API
  version: 0.2.0
  description: |
    Đặc tả các endpoint đã có trong `backend/internal/httpapi/router.go`.
    Endpoint mới được thêm vào file này cùng lúc với code.
    Danh sách endpoint dự kiến nằm ở mục 7 của `docs/design/README.md`.

    Endpoint có `x-feature` trả `404 feature_disabled` khi một trong các cờ đó tắt.
    Endpoint có `x-roles` trả `403 forbidden` với vai trò khác.
    Endpoint có `x-environment: non-production` chỉ được đăng ký khi `APP_ENV` khác `production`.
    Ở môi trường `production` các endpoint này không tồn tại và trả `404`.

    Phiên đăng nhập gửi qua cookie `session_token`, hoặc header `Authorization: Bearer <token>`.
servers:
  - url: http://127.0.0.1:3001
    description: Chạy bằng Docker Compose, đi qua nginx của frontend

tags:
  - name: system
  - name: auth
  - name: events
  - name: seats
  - name: organizer
  - name: pricing
  - name: recommendations
  - name: tickets

paths:
  /api/health:
    get:
      tags: [system]
      summary: Kiểm tra api còn chạy
      operationId: getHealth
      responses:
        '200':
          description: api đang chạy
          content:
            application/json:
              schema:
                type: object
                required: [status, service, profile]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: eventticketing-api
                  profile:
                    type: string
                    example: sprint2

  /api/features:
    get:
      tags: [system]
      summary: Profile và trạng thái từng cờ tính năng
      operationId: getFeatures
      responses:
        '200':
          description: Danh sách cờ
          content:
            application/json:
              schema:
                type: object
                required: [profile, features]
                properties:
                  profile:
                    type: string
                    example: sprint2
                  features:
                    type: object
                    additionalProperties:
                      type: boolean
                    example:
                      otp_login: true
                      seat_hold: true
                      waiting_room: false

  /api/auth/otp/request:
    post:
      tags: [auth]
      summary: Xin mã OTP đăng nhập (FR-01, FR-04)
      description: |
        Có `@` thì gửi qua email, còn lại là SĐT.
        Mỗi `destination` phải cách lần trước 60 giây và tối đa 5 mã mỗi giờ.
        `demoCode` chỉ có khi `OTP_DEMO=true` và tài khoản không phải nhân sự.
      operationId: requestOtp
      x-feature: [otp_login]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination]
              properties:
                destination:
                  type: string
                  example: '0901234567'
      responses:
        '200':
          description: Đã tạo mã
          content:
            application/json:
              schema:
                type: object
                required: [status, destination]
                properties:
                  status:
                    type: string
                    enum: [sent]
                  destination:
                    type: string
                    description: Đã chuẩn hóa
                  demoCode:
                    type: string
                    pattern: '^[0-9]{6}$'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          description: '`rate_limited` (quá 30 lần/phút từ một IP) hoặc `otp_rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/otp/verify:
    post:
      tags: [auth]
      summary: Xác thực mã OTP và mở phiên
      description: |
        Mỗi mã cho nhập tối đa 5 lần.
        Lần đầu đăng nhập thì tạo tài khoản `CUSTOMER`.
        Phiên có hạn 7 ngày.
      operationId: verifyOtp
      x-feature: [otp_login]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination, code]
              properties:
                destination:
                  type: string
                code:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: Đăng nhập thành công
          headers:
            Set-Cookie:
              description: '`session_token=<token>; Path=/; Max-Age=604800; HttpOnly; SameSite=Lax`'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: '`otp_invalid`: mã sai, hết hạn, đã dùng hoặc đã nhập sai 5 lần'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`account_inactive`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          $ref: '#/components/responses/Error'

  /api/auth/demo-login:
    post:
      tags: [auth]
      summary: Đăng nhập thử nhanh, mỗi lần tạo một tài khoản khán giả mới
      description: |
        Chỉ có khi `APP_ENV` khác `production`.
        Mỗi lần gọi tạo một tài khoản `CUSTOMER` mới và mở phiên.
        Không có tài khoản Ban Tổ chức qua endpoint này.
      operationId: demoLogin
      x-environment: non-production
      responses:
        '200':
          description: Đã tạo tài khoản và mở phiên
          headers:
            Set-Cookie:
              description: '`session_token=<token>; Path=/; Max-Age=604800; HttpOnly; SameSite=Lax`'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '404':
          description: Không có endpoint này khi `APP_ENV=production`

  /api/auth/me:
    get:
      tags: [auth]
      summary: Người dùng của phiên hiện tại
      operationId: getMe
      security:
        - sessionCookie: []
        - bearer: []
      responses:
        '200':
          description: Phiên hợp lệ
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Đăng xuất
      description: Xóa phiên nếu có. Luôn trả 200.
      operationId: logout
      responses:
        '200':
          description: Đã đăng xuất, cookie bị xóa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [logged_out]

  /api/events:
    get:
      tags: [events]
      summary: Sự kiện đang bán, hết vé hoặc tạm dừng (FR-02)
      description: Sắp xếp theo giờ diễn ra tăng dần.
      operationId: listEvents
      responses:
        '200':
          description: Danh sách sự kiện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSummary'

  /api/events/{slug}:
    get:
      tags: [events]
      summary: Chi tiết sự kiện kèm giá từng khu vực
      operationId: getEvent
      parameters:
        - name: slug
          in: path
          required: true
          description: Slug hoặc UUID của sự kiện
          schema:
            type: string
      responses:
        '200':
          description: Chi tiết sự kiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '404':
          description: '`event_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/events/{id}/seats:
    get:
      tags: [seats]
      summary: Sơ đồ ghế của sự kiện (FR-03, FR-05)
      description: |
        Không bắt buộc đăng nhập.
        Có phiên thì ghế mình đang giữ có `status = selected`.
      operationId: getSeatMap
      x-feature: [seat_map_realtime]
      parameters:
        - $ref: '#/components/parameters/EventRef'
      responses:
        '200':
          description: Danh sách ghế
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatMapItem'
        '404':
          description: '`event_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/events/{id}/stream:
    get:
      tags: [seats]
      summary: Luồng SSE cập nhật trạng thái ghế (NFR-10)
      description: |
        Mở bằng `EventSource`.
        Sự kiện đầu tiên là `connected`.
        Mỗi thay đổi ghế gửi một sự kiện `update`, nội dung là `SeatUpdate`.
        Cứ 15 giây api gửi một dòng chú thích `: ping` để giữ kết nối.
      operationId: streamSeats
      x-feature: [seat_map_realtime]
      parameters:
        - $ref: '#/components/parameters/EventRef'
      responses:
        '200':
          description: Luồng `text/event-stream`
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: connected
                data: {"status":"subscribed","eventId":"7d0c…"}

                event: update
                data: {"type":"seat_held","eventId":"7d0c…","seatId":"a1b2…","status":"HELD","timestamp":"2026-11-03T10:00:00Z"}
        '404':
          $ref: '#/components/responses/FeatureDisabled'

  /api/holds:
    get:
      tags: [seats]
      summary: Các lượt giữ ghế còn hiệu lực của người gọi
      operationId: listMyHolds
      x-feature: [seat_hold]
      security:
        - sessionCookie: []
        - bearer: []
      responses:
        '200':
          description: Danh sách lượt giữ đang `ACTIVE`, mỗi phần tử có dạng như phản hồi của `POST /api/holds`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatHold'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
    post:
      tags: [seats]
      summary: Giữ một ghế trong 5 phút (FR-06, FR-07)
      description: |
        Sự kiện phải đang `ON_SALE` và trong thời gian mở bán.
        Khi cờ `ticket_limit` bật, tổng ghế đang giữ và vé đã mua không vượt `maxTicketsPerUser`.
      operationId: holdSeat
      x-feature: [seat_hold]
      security:
        - sessionCookie: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, seatId]
              properties:
                eventId:
                  type: string
                  description: UUID hoặc slug của sự kiện
                seatId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Đã giữ ghế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatHold'
        '400':
          description: '`invalid_payload`, `invalid_event_id`, `invalid_seat_id` hoặc `ticket_limit_reached`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '409':
          description: '`seat_not_available` hoặc `event_not_on_sale`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/holds/{seatId}:
    delete:
      tags: [seats]
      summary: Nhả ghế mình đang giữ
      operationId: releaseSeat
      x-feature: [seat_hold]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - name: seatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eventId
          in: query
          required: true
          description: UUID hoặc slug của sự kiện
          schema:
            type: string
      responses:
        '200':
          description: Đã nhả ghế
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [released]
        '400':
          description: '`missing_seat_id`, `invalid_seat_id` hoặc `missing_or_invalid_event_id`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`hold_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/organizer/events:
    get:
      tags: [organizer]
      summary: Sự kiện của Ban Tổ chức đang đăng nhập (FR-08)
      description: '`ADMIN` thấy mọi sự kiện.'
      operationId: listOrganizerEvents
      x-feature: [organizer_console]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      responses:
        '200':
          description: Danh sách sự kiện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizerEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FeatureDisabled'

  /api/organizer/events/{id}:
    get:
      tags: [organizer]
      summary: Thông tin sự kiện để BTC xem và sửa (FR-08)
      description: Kèm tồn kho từng khu vực và cờ `venueShared` khi địa điểm dùng chung với sự kiện khác.
      operationId: getOrganizerEvent
      x-feature: [organizer_console]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EventRef'
      responses:
        '200':
          description: Sự kiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerEventDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotEventOrganizer'
        '404':
          description: '`event_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [organizer]
      summary: Sửa thông tin sự kiện (FR-08)
      description: |
        Sửa đúng sự kiện này, không tạo bản ghi mới; `slug` giữ nguyên.
        Tên và địa chỉ địa điểm chỉ sửa được khi không sự kiện nào khác dùng địa điểm đó.
        Mỗi lần lưu ghi một dòng `EVENT_UPDATED` vào `audit_logs`.
        Trang sự kiện của khán giả đọc thông tin mới ngay.
      operationId: updateOrganizerEvent
      x-feature: [organizer_console]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EventRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInfo'
      responses:
        '200':
          description: Đã lưu, kèm thông tin mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerEventDetail'
        '400':
          description: '`invalid_payload`, hoặc `invalid_event_field` kèm `field` là trường bị từ chối'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  field:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotEventOrganizer'
        '404':
          description: '`event_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`venue_shared`: địa điểm dùng chung, không đổi tên hoặc địa chỉ ở đây được'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/organizer/events/{id}/zones/{zoneId}/pricing:
    put:
      tags: [organizer]
      summary: Đặt giá cơ bản, giá sàn, giá trần của một khu vực (FR-08)
      description: |
        Điều kiện: 0 ≤ `floorPrice` ≤ `basePrice` ≤ `ceilingPrice`.
        Đổi `basePrice` thì mọi ghế còn trống trong khu vực nhận giá mới,
        và một dòng `MANUAL` được ghi vào `price_changes`.
        Luồng SSE gửi `zone_repriced`.
        Lưu giá cũng là duyệt giá sàn, giá trần cho chế độ định giá Tự động.
      operationId: updateZonePricing
      x-feature: [organizer_console, zone_pricing]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EventRef'
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZonePricing'
      responses:
        '200':
          description: Giá đã lưu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZonePricing'
        '400':
          description: '`invalid_payload` hoặc `invalid_price_bounds`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`forbidden` (sai vai trò) hoặc `not_event_organizer` (không phải BTC của sự kiện)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`event_not_found`, `zone_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/organizer/events/{id}/pricing:
    get:
      tags: [pricing]
      summary: Tổng quan định giá động của một sự kiện (FR-22)
      description: |
        Phân tích lại ngay lúc gọi, không đổi giá.
        Mỗi khu vực có giá đang bán, khoảng đã duyệt, tồn kho, tốc độ bán,
        đề xuất của AI và đề xuất đang chờ duyệt.
        Kèm số lượt xem, giữ ghế, vé bán theo giờ trong 48 giờ qua.
      operationId: getPricingOverview
      x-feature: [organizer_console, dynamic_pricing]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EventRef'
      responses:
        '200':
          description: Tổng quan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotEventOrganizer'
        '404':
          $ref: '#/components/responses/FeatureDisabled'

  /api/organizer/events/{id}/pricing/settings:
    put:
      tags: [pricing]
      summary: Chọn chế độ định giá của sự kiện
      description: |
        Tắt: `enabled=false`. Thủ công có đề xuất: `enabled=true, autoAdjust=false`.
        Tự động: `enabled=true, autoAdjust=true`; mọi khu vực tham gia phải đã duyệt giá sàn, giá trần.
        Bật cho sự kiện chưa có khu vực nào tham gia thì mọi khu vực cùng tham gia.
        Tắt hoặc chuyển sang Tự động thì các đề xuất đang chờ hết hạn.
      operationId: updatePricingSettings
      x-feature: [organizer_console, dynamic_pricing]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EventRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingSettings'
      responses:
        '200':
          description: Đã lưu, kèm tổng quan mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingOverview'
        '400':
          description: '`invalid_payload` hoặc `invalid_pricing_settings`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotEventOrganizer'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '409':
          description: '`bounds_not_approved`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/organizer/events/{id}/zones/{zoneId}/dynamic-pricing:
    put:
      tags: [pricing]
      summary: Cho một khu vực tham gia định giá động hoặc không
      operationId: setZoneIncluded
      x-feature: [organizer_console, dynamic_pricing]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EventRef'
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [included]
              properties:
                included:
                  type: boolean
      responses:
        '204':
          description: Đã lưu
        '400':
          description: '`invalid_payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotEventOrganizer'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '409':
          description: '`bounds_not_approved`: đang Tự động mà khu vực chưa duyệt giá sàn, giá trần'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

