openapi: 3.0.3
info:
  title: EventTicketing API
  version: 0.2.0
  description: |
    Đặc tả các endpoint đã có trong `backend/internal/httpapi/router.go`.
    Endpoint mới được thêm vào file này cùng lúc với code.
    Danh sách endpoint dự kiến nằm ở mục 7 của `docs/design/README.md`.

    Endpoint có `x-feature` trả `404 feature_disabled` khi một trong các cờ đó tắt.
    Endpoint có `x-roles` trả `403 forbidden` với vai trò khác.

    Phiên đăng nhập gửi qua cookie `session_token`, hoặc header `Authorization: Bearer <token>`.
servers:
  - url: http://127.0.0.1:3001
    description: Chạy bằng Docker Compose, đi qua nginx của frontend

tags:
  - name: system
  - name: auth
  - name: events
  - name: seats
  - name: organizer

paths:
  /api/health:
    get:
      tags: [system]
      summary: Kiểm tra api còn chạy
      operationId: getHealth
      responses:
        '200':
          description: api đang chạy
          content:
            application/json:
              schema:
                type: object
                required: [status, service, profile]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: eventticketing-api
                  profile:
                    type: string
                    example: sprint2

  /api/features:
    get:
      tags: [system]
      summary: Profile và trạng thái từng cờ tính năng
      operationId: getFeatures
      responses:
        '200':
          description: Danh sách cờ
          content:
            application/json:
              schema:
                type: object
                required: [profile, features]
                properties:
                  profile:
                    type: string
                    example: sprint2
                  features:
                    type: object
                    additionalProperties:
                      type: boolean
                    example:
                      otp_login: true
                      seat_hold: true
                      waiting_room: false

  /api/auth/otp/request:
    post:
      tags: [auth]
      summary: Xin mã OTP đăng nhập (FR-01, FR-04)
      description: |
        Có `@` thì gửi qua email, còn lại là SĐT.
        Mỗi `destination` phải cách lần trước 60 giây và tối đa 5 mã mỗi giờ.
        `demoCode` chỉ có khi `OTP_DEMO=true` và tài khoản không phải nhân sự.
      operationId: requestOtp
      x-feature: [otp_login]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination]
              properties:
                destination:
                  type: string
                  example: '0901234567'
      responses:
        '200':
          description: Đã tạo mã
          content:
            application/json:
              schema:
                type: object
                required: [status, destination]
                properties:
                  status:
                    type: string
                    enum: [sent]
                  destination:
                    type: string
                    description: Đã chuẩn hóa
                  demoCode:
                    type: string
                    pattern: '^[0-9]{6}$'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          description: '`rate_limited` (quá 30 lần/phút từ một IP) hoặc `otp_rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/otp/verify:
    post:
      tags: [auth]
      summary: Xác thực mã OTP và mở phiên
      description: |
        Mỗi mã cho nhập tối đa 5 lần.
        Lần đầu đăng nhập thì tạo tài khoản `CUSTOMER`.
        Phiên có hạn 7 ngày.
      operationId: verifyOtp
      x-feature: [otp_login]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination, code]
              properties:
                destination:
                  type: string
                code:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: Đăng nhập thành công
          headers:
            Set-Cookie:
              description: '`session_token=<token>; Path=/; Max-Age=604800; HttpOnly; SameSite=Lax`'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: '`otp_invalid`: mã sai, hết hạn, đã dùng hoặc đã nhập sai 5 lần'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`account_inactive`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          $ref: '#/components/responses/Error'

  /api/auth/me:
    get:
      tags: [auth]
      summary: Người dùng của phiên hiện tại
      operationId: getMe
      security:
        - sessionCookie: []
        - bearer: []
      responses:
        '200':
          description: Phiên hợp lệ
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Đăng xuất
      description: Xóa phiên nếu có. Luôn trả 200.
      operationId: logout
      responses:
        '200':
          description: Đã đăng xuất, cookie bị xóa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [logged_out]

  /api/events:
    get:
      tags: [events]
      summary: Sự kiện đang bán, hết vé hoặc tạm dừng (FR-02)
      description: Sắp xếp theo giờ diễn ra tăng dần.
      operationId: listEvents
      responses:
        '200':
          description: Danh sách sự kiện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSummary'

  /api/events/{slug}:
    get:
      tags: [events]
      summary: Chi tiết sự kiện kèm giá từng khu vực
      operationId: getEvent
      parameters:
        - name: slug
          in: path
          required: true
          description: Slug hoặc UUID của sự kiện
          schema:
            type: string
      responses:
        '200':
          description: Chi tiết sự kiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '404':
          description: '`event_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/events/{id}/seats:
    get:
      tags: [seats]
      summary: Sơ đồ ghế của sự kiện (FR-03, FR-05)
      description: |
        Không bắt buộc đăng nhập.
        Có phiên thì ghế mình đang giữ có `status = selected`.
      operationId: getSeatMap
      x-feature: [seat_map_realtime]
      parameters:
        - $ref: '#/components/parameters/EventRef'
      responses:
        '200':
          description: Danh sách ghế
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatMapItem'
        '404':
          description: '`event_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/events/{id}/stream:
    get:
      tags: [seats]
      summary: Luồng SSE cập nhật trạng thái ghế (NFR-10)
      description: |
        Mở bằng `EventSource`.
        Sự kiện đầu tiên là `connected`.
        Mỗi thay đổi ghế gửi một sự kiện `update`, nội dung là `SeatUpdate`.
        Cứ 15 giây api gửi một dòng chú thích `: ping` để giữ kết nối.
      operationId: streamSeats
      x-feature: [seat_map_realtime]
      parameters:
        - $ref: '#/components/parameters/EventRef'
      responses:
        '200':
          description: Luồng `text/event-stream`
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: connected
                data: {"status":"subscribed","eventId":"7d0c…"}

                event: update
                data: {"type":"seat_held","eventId":"7d0c…","seatId":"a1b2…","status":"HELD","timestamp":"2026-11-03T10:00:00Z"}
        '404':
          $ref: '#/components/responses/FeatureDisabled'

  /api/holds:
    post:
      tags: [seats]
      summary: Giữ một ghế trong 5 phút (FR-06, FR-07)
      description: |
        Sự kiện phải đang `ON_SALE` và trong thời gian mở bán.
        Khi cờ `ticket_limit` bật, tổng ghế đang giữ và vé đã mua không vượt `maxTicketsPerUser`.
      operationId: holdSeat
      x-feature: [seat_hold]
      security:
        - sessionCookie: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, seatId]
              properties:
                eventId:
                  type: string
                  description: UUID hoặc slug của sự kiện
                seatId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Đã giữ ghế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatHold'
        '400':
          description: '`invalid_payload`, `invalid_event_id`, `invalid_seat_id` hoặc `ticket_limit_reached`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '409':
          description: '`seat_not_available` hoặc `event_not_on_sale`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/holds/{seatId}:
    delete:
      tags: [seats]
      summary: Nhả ghế mình đang giữ
      operationId: releaseSeat
      x-feature: [seat_hold]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - name: seatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eventId
          in: query
          required: true
          description: UUID hoặc slug của sự kiện
          schema:
            type: string
      responses:
        '200':
          description: Đã nhả ghế
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [released]
        '400':
          description: '`missing_seat_id`, `invalid_seat_id` hoặc `missing_or_invalid_event_id`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`hold_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/organizer/events:
    get:
      tags: [organizer]
      summary: Sự kiện của Ban Tổ chức đang đăng nhập (FR-08)
      description: '`ADMIN` thấy mọi sự kiện.'
      operationId: listOrganizerEvents
      x-feature: [organizer_console]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      responses:
        '200':
          description: Danh sách sự kiện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizerEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FeatureDisabled'

  /api/organizer/events/{id}/zones/{zoneId}/pricing:
    put:
      tags: [organizer]
      summary: Đặt giá cơ bản, giá sàn, giá trần của một khu vực (FR-08)
      description: |
        Điều kiện: 0 ≤ `floorPrice` ≤ `basePrice` ≤ `ceilingPrice`.
        Đổi `basePrice` thì mọi ghế còn trống trong khu vực nhận giá mới,
        và một dòng `MANUAL` được ghi vào `price_changes`.
      operationId: updateZonePricing
      x-feature: [organizer_console, zone_pricing]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EventRef'
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZonePricing'
      responses:
        '200':
          description: Giá đã lưu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZonePricing'
        '400':
          description: '`invalid_payload` hoặc `invalid_price_bounds`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`forbidden` (sai vai trò) hoặc `not_event_organizer` (không phải BTC của sự kiện)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`event_not_found`, `zone_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_token
    bearer:
      type: http
      scheme: bearer

  parameters:
    EventRef:
      name: id
      in: path
      required: true
      description: UUID hoặc slug của sự kiện
      schema:
        type: string

  responses:
    Error:
      description: Lỗi, mã nằm trong trường `error`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: '`unauthorized`: chưa đăng nhập, phiên hết hạn hoặc tài khoản không còn `ACTIVE`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`forbidden`: vai trò không được phép'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FeatureDisabled:
      description: '`feature_disabled`: cờ tính năng đang tắt'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: seat_not_available
        feature:
          type: string
          description: Chỉ có khi `error = feature_disabled`
          example: seat_hold

    User:
      type: object
      required: [id, phone, email, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          description: Chuỗi rỗng nếu chưa có
        email:
          type: string
          description: Chuỗi rỗng nếu chưa có
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    UserRole:
      type: string
      enum: [CUSTOMER, ORGANIZER, CEO, GATE_STAFF, ADMIN]

    EventStatus:
      type: string
      enum: [DRAFT, ON_SALE, SOLD_OUT, PAUSED, ENDED, CANCELLED]

    EventSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        genre:
          type: string
        city:
          type: string
        imageUrl:
          type: string
        imageCredit:
          type: string
        venue:
          type: string
        address:
          type: string
        date:
          type: string
          format: date-time
          description: Giờ bắt đầu
        endsAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EventStatus'
        priceFrom:
          type: integer
          format: int64
          description: Giá cơ bản thấp nhất trong các khu vực, VND

    EventDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        genre:
          type: string
        imageUrl:
          type: string
        imageCredit:
          type: string
        city:
          type: string
        venueName:
          type: string
        venueAddress:
          type: string
        venueTimezone:
          type: string
          example: Asia/Ho_Chi_Minh
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EventStatus'
        maxTicketsPerUser:
          type: integer
        waitingRoomEnabled:
          type: boolean
        zones:
          type: array
          items:
            $ref: '#/components/schemas/EventZonePrice'

    EventZonePrice:
      type: object
      properties:
        zoneId:
          type: string
          format: uuid
        zoneCode:
          type: string
        zoneName:
          type: string
        floor:
          type: string
        capacity:
          type: integer
        basePrice:
          type: integer
          format: int64
        floorPrice:
          type: integer
          format: int64
        ceilingPrice:
          type: integer
          format: int64
        isDynamicPricingEnabled:
          type: boolean

    SeatMapItem:
      type: object
      properties:
        eventSeatId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        seatId:
          type: string
          format: uuid
        status:
          type: string
          enum: [available, held, sold, selected]
          description: '`selected` là ghế người gọi đang giữ'
        currentPrice:
          type: integer
          format: int64
        row:
          type: string
        number:
          type: string
        label:
          type: string
        x:
          type: number
        y:
          type: number
        zoneId:
          type: string
          format: uuid
        zoneCode:
          type: string
        zoneName:
          type: string
        isMyHold:
          type: boolean

    SeatHold:
      type: object
      required: [holdId, holdToken, seatId, eventId, expiresAt]
      properties:
        holdId:
          type: string
          format: uuid
        holdToken:
          type: string
        seatId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: Giờ hết hạn theo server, dùng cho đồng hồ đếm ngược

    SeatUpdate:
      description: Nội dung `data` của sự kiện SSE `update`
      type: object
      properties:
        type:
          type: string
          enum: [seat_held, seat_released, seat_expired]
        eventId:
          type: string
          format: uuid
        seatId:
          type: string
          format: uuid
        status:
          type: string
          enum: [AVAILABLE, HELD, SOLD]
        timestamp:
          type: string
          format: date-time

    OrganizerEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          $ref: '#/components/schemas/EventStatus'
        startsAt:
          type: string
          format: date-time
        imageUrl:
          type: string
        venueName:
          type: string

    ZonePricing:
      type: object
      required: [basePrice, floorPrice, ceilingPrice]
      properties:
        basePrice:
          type: integer
          format: int64
          description: VND
        floorPrice:
          type: integer
          format: int64
        ceilingPrice:
          type: integer
          format: int64
