openapi: 3.0.3
info:
  title: EventTicketing API
  version: 0.4.0
  description: |
    Đặc tả các endpoint đã có trong `backend/internal/httpapi/router.go`.
    Endpoint mới được thêm vào file này cùng lúc với code.
    Danh sách endpoint dự kiến nằm ở mục 7 của `docs/design/README.md`.

    Endpoint có `x-feature` trả `404 feature_disabled` khi một trong các cờ đó tắt.
    Endpoint có `x-roles` trả `403 forbidden` với vai trò khác.
    Endpoint có `x-environment: non-production` chỉ được đăng ký khi `APP_ENV` khác `production`.
    Ở môi trường `production` các endpoint này không tồn tại và trả `404`.

    Phiên đăng nhập gửi qua cookie `session_token`, hoặc header `Authorization: Bearer <token>`.
servers:
  - url: http://127.0.0.1:3001
    description: Chạy bằng Docker Compose, đi qua nginx của frontend

tags:
  - name: system
  - name: auth
  - name: events
  - name: seats
  - name: organizer
  - name: tickets
  - name: payments
  - name: assistant
  - name: feedback

paths:
  /api/health:
    get:
      tags: [system]
      summary: Kiểm tra api còn chạy
      operationId: getHealth
      responses:
        '200':
          description: api đang chạy
          content:
            application/json:
              schema:
                type: object
                required: [status, service, profile]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: eventticketing-api
                  profile:
                    type: string
                    example: sprint2

  /api/features:
    get:
      tags: [system]
      summary: Profile và trạng thái từng cờ tính năng
      operationId: getFeatures
      responses:
        '200':
          description: Danh sách cờ
          content:
            application/json:
              schema:
                type: object
                required: [profile, features]
                properties:
                  profile:
                    type: string
                    example: sprint2
                  features:
                    type: object
                    additionalProperties:
                      type: boolean
                    example:
                      otp_login: true
                      seat_hold: true
                      waiting_room: false

  /api/auth/otp/request:
    post:
      tags: [auth]
      summary: Xin mã OTP đăng nhập (FR-01, FR-04)
      description: |
        Có `@` thì gửi qua email, còn lại là SĐT.
        Mỗi `destination` phải cách lần trước 60 giây và tối đa 5 mã mỗi giờ.
        `demoCode` chỉ có khi `OTP_DEMO=true` và tài khoản không phải nhân sự.
        Số điện thoại được chuẩn hóa về dạng `+84...`: `0912345678`, `84912345678` và `+84912345678` là cùng một số.
        Khi `OTP_APP_DELIVERY=true`, mã gửi tới số điện thoại không hiện trên màn hình và không ghi log.
        Ứng dụng Android COSH301 OTP lấy mã (xem `docs/otp-app.md`) và phản hồi có `delivery: app`.
        Mã gửi tới email không đổi.
      operationId: requestOtp
      x-feature: [otp_login]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination]
              properties:
                destination:
                  type: string
                  example: '0901234567'
      responses:
        '200':
          description: Đã tạo mã
          content:
            application/json:
              schema:
                type: object
                required: [status, destination]
                properties:
                  status:
                    type: string
                    enum: [sent]
                  destination:
                    type: string
                    description: Đã chuẩn hóa
                  demoCode:
                    type: string
                    pattern: '^[0-9]{6}$'
                  delivery:
                    type: string
                    enum: [app]
                    description: Có khi mã được giao cho ứng dụng Android COSH301 OTP
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          description: '`rate_limited` (quá 30 lần/phút từ một IP) hoặc `otp_rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/otp-app/claim:
    post:
      tags: [auth]
      summary: Ứng dụng Android lấy mã đăng nhập đang chờ
      description: |
        Chỉ được đăng ký khi `OTP_APP_DELIVERY=true`.
        Trả mã mới nhất còn hạn của số điện thoại, đúng một lần rồi xóa khỏi server.
        Không có mã thì trả `204`, giống nhau cho mọi số, nên không lộ số đó có tài khoản hay không.
        Số điện thoại nằm trong body để không vào log của proxy.
        Giới hạn 60 lần/phút từ một IP.
      operationId: claimAppOtp
      x-feature: [otp_login]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpAppPhone'
      responses:
        '200':
          description: Mã đang chờ
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code:
                    type: string
                    pattern: '^[0-9]{6}$'
        '204':
          description: Không có mã nào đang chờ
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/otp-app/stream:
    post:
      tags: [auth]
      summary: Luồng SSE báo có mã đang chờ cho một số điện thoại
      description: |
        Chỉ được đăng ký khi `OTP_APP_DELIVERY=true`.
        Luồng chỉ báo hiệu, không mang mã: khi nhận `pending`, ứng dụng gọi `/api/otp-app/claim`.
        Sự kiện: `connected` khi mở luồng, `pending` khi có mã mới, và dòng `: ping` mỗi 15 giây.
        Mỗi số có tối đa 4 luồng, toàn server tối đa 500 luồng (`429 too_many_streams`).
      operationId: streamAppOtp
      x-feature: [otp_login]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpAppPhone'
      responses:
        '200':
          description: Luồng `text/event-stream`
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          description: '`rate_limited` hoặc `too_many_streams`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/otp/verify:
    post:
      tags: [auth]
      summary: Xác thực mã OTP và mở phiên
      description: |
        Mỗi mã cho nhập tối đa 5 lần.
        Lần đầu đăng nhập thì tạo tài khoản `CUSTOMER`.
        Phiên có hạn 7 ngày.
      operationId: verifyOtp
      x-feature: [otp_login]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination, code]
              properties:
                destination:
                  type: string
                code:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: Đăng nhập thành công
          headers:
            Set-Cookie:
              description: '`session_token=<token>; Path=/; Max-Age=604800; HttpOnly; SameSite=Lax`'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: '`otp_invalid`: mã sai, hết hạn, đã dùng hoặc đã nhập sai 5 lần'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`account_inactive`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          $ref: '#/components/responses/Error'

  /api/auth/demo-login:
    post:
      tags: [auth]
      summary: Đăng nhập thử nhanh, mỗi lần tạo một tài khoản khán giả mới
      description: |
        Chỉ có khi `APP_ENV` khác `production`.
        Mỗi lần gọi tạo một tài khoản `CUSTOMER` mới và mở phiên.
        Không có tài khoản Ban Tổ chức qua endpoint này.
      operationId: demoLogin
      x-environment: non-production
      responses:
        '200':
          description: Đã tạo tài khoản và mở phiên
          headers:
            Set-Cookie:
              description: '`session_token=<token>; Path=/; Max-Age=604800; HttpOnly; SameSite=Lax`'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '404':
          description: Không có endpoint này khi `APP_ENV=production`

  /api/auth/me:
    get:
      tags: [auth]
      summary: Người dùng của phiên hiện tại
      operationId: getMe
      security:
        - sessionCookie: []
        - bearer: []
      responses:
        '200':
          description: Phiên hợp lệ
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Đăng xuất
      description: Xóa phiên nếu có. Luôn trả 200.
      operationId: logout
      responses:
        '200':
          description: Đã đăng xuất, cookie bị xóa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [logged_out]

  /api/events:
    get:
      tags: [events]
      summary: Sự kiện đang bán, hết vé hoặc tạm dừng (FR-02)
      description: Sắp xếp theo giờ diễn ra tăng dần.
      operationId: listEvents
      responses:
        '200':
          description: Danh sách sự kiện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSummary'

  /api/events/{slug}:
    get:
      tags: [events]
      summary: Chi tiết sự kiện kèm giá từng khu vực
      operationId: getEvent
      parameters:
        - name: slug
          in: path
          required: true
          description: Slug hoặc UUID của sự kiện
          schema:
            type: string
      responses:
        '200':
          description: Chi tiết sự kiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '404':
          description: '`event_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/events/{id}/seats:
    get:
      tags: [seats]
      summary: Sơ đồ ghế của sự kiện (FR-03, FR-05)
      description: |
        Không bắt buộc đăng nhập.
        Có phiên thì ghế mình đang giữ có `status = selected`.
      operationId: getSeatMap
      x-feature: [seat_map_realtime]
      parameters:
        - $ref: '#/components/parameters/EventRef'
      responses:
        '200':
          description: Danh sách ghế
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatMapItem'
        '404':
          description: '`event_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/events/{id}/stream:
    get:
      tags: [seats]
      summary: Luồng SSE cập nhật trạng thái ghế (NFR-10)
      description: |
        Mở bằng `EventSource`.
        Sự kiện đầu tiên là `connected`.
        Mỗi thay đổi ghế gửi một sự kiện `update`, nội dung là `SeatUpdate`.
        Khi giá một khu vực đổi (BTC duyệt đề xuất giá động hoặc đặt giá tay), api gửi một sự kiện `update` có `type` là `price_changed`, nội dung là `PriceChanged`.
        Cứ 15 giây api gửi một dòng chú thích `: ping` để giữ kết nối.
      operationId: streamSeats
      x-feature: [seat_map_realtime]
      parameters:
        - $ref: '#/components/parameters/EventRef'
      responses:
        '200':
          description: Luồng `text/event-stream`
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: connected
                data: {"status":"subscribed","eventId":"7d0c…"}

                event: update
                data: {"type":"seat_held","eventId":"7d0c…","seatId":"a1b2…","status":"HELD","timestamp":"2026-11-03T10:00:00Z"}

                event: update
                data: {"type":"price_changed","eventId":"7d0c…","zoneId":"3f9e…","oldPrice":500000,"newPrice":540000,"reason":"DYNAMIC","timestamp":"2026-11-03T10:05:00Z"}
        '404':
          $ref: '#/components/responses/FeatureDisabled'

  /api/holds:
    get:
      tags: [seats]
      summary: Các lượt giữ ghế còn hiệu lực của người gọi
      operationId: listMyHolds
      x-feature: [seat_hold]
      security:
        - sessionCookie: []
        - bearer: []
      responses:
        '200':
          description: Danh sách lượt giữ đang `ACTIVE`, mỗi phần tử có dạng như phản hồi của `POST /api/holds`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatHold'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
    post:
      tags: [seats]
      summary: Giữ một ghế trong 5 phút (FR-06, FR-07)
      description: |
        Sự kiện phải đang `ON_SALE` và trong thời gian mở bán.
        Khi cờ `ticket_limit` bật, tổng ghế đang giữ và vé đã mua không vượt `maxTicketsPerUser`.
      operationId: holdSeat
      x-feature: [seat_hold]
      security:
        - sessionCookie: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, seatId]
              properties:
                eventId:
                  type: string
                  description: UUID hoặc slug của sự kiện
                seatId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Đã giữ ghế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatHold'
        '400':
          description: '`invalid_payload`, `invalid_event_id`, `invalid_seat_id` hoặc `ticket_limit_reached`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '409':
          description: '`seat_not_available` hoặc `event_not_on_sale`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/holds/{seatId}:
    delete:
      tags: [seats]
      summary: Nhả ghế mình đang giữ
      operationId: releaseSeat
      x-feature: [seat_hold]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - name: seatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eventId
          in: query
          required: true
          description: UUID hoặc slug của sự kiện
          schema:
            type: string
      responses:
        '200':
          description: Đã nhả ghế
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [released]
        '400':
          description: '`missing_seat_id`, `invalid_seat_id` hoặc `missing_or_invalid_event_id`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`hold_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/organizer/events:
    get:
      tags: [organizer]
      summary: Sự kiện của Ban Tổ chức đang đăng nhập (FR-08)
      description: '`ADMIN` thấy mọi sự kiện.'
      operationId: listOrganizerEvents
      x-feature: [organizer_console]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      responses:
        '200':
          description: Danh sách sự kiện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizerEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FeatureDisabled'

  /api/organizer/events/{id}/zones/{zoneId}/pricing:
    put:
      tags: [organizer]
      summary: Đặt giá cơ bản, giá sàn, giá trần của một khu vực (FR-08)
      description: |
        Điều kiện: 0 ≤ `floorPrice` ≤ `basePrice` ≤ `ceilingPrice`.
        Đổi `basePrice` thì mọi ghế còn trống trong khu vực nhận giá mới,
        và một dòng `MANUAL` được ghi vào `price_changes`.
      operationId: updateZonePricing
      x-feature: [organizer_console, zone_pricing]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EventRef'
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZonePricing'
      responses:
        '200':
          description: Giá đã lưu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZonePricing'
        '400':
          description: '`invalid_payload` hoặc `invalid_price_bounds`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`forbidden` (sai vai trò) hoặc `not_event_organizer` (không phải BTC của sự kiện)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`event_not_found`, `zone_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/organizer/events/{id}/pricing:
    get:
      tags: [organizer]
      summary: Số liệu định giá động của từng khu vực (FR-22)
      description: |
        Trả số liệu đầu vào tính ở thời điểm gọi, đề xuất đang chờ duyệt và các lần đổi giá gần nhất của từng khu vực.
        Không đổi dữ liệu.
      operationId: getEventPricing
      x-feature: [organizer_console, dynamic_pricing]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EventRef'
      responses:
        '200':
          description: Bảng số liệu định giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`forbidden` (sai vai trò) hoặc `not_event_organizer` (không phải BTC của sự kiện)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`event_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/organizer/events/{id}/pricing/run:
    post:
      tags: [organizer]
      summary: Chạy ngay một lượt phân tích giá cho sự kiện (FR-22)
      description: |
        Làm điều mà tác vụ nền làm mỗi 5 phút, nhưng chỉ cho một sự kiện: tạo, làm mới hoặc rút lại đề xuất của từng khu vực.
        Không đổi giá nào. Giới hạn 30 lần mỗi phút mỗi địa chỉ (`429 rate_limited`).
      operationId: runEventPricing
      x-feature: [organizer_console, dynamic_pricing]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EventRef'
      responses:
        '200':
          description: Kết quả lượt phân tích và bảng số liệu mới
          content:
            application/json:
              schema:
                type: object
                required: [run, overview]
                properties:
                  run:
                    $ref: '#/components/schemas/PricingRunSummary'
                  overview:
                    $ref: '#/components/schemas/PricingOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`forbidden` hoặc `not_event_organizer`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`event_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/organizer/events/{id}/zones/{zoneId}/dynamic-pricing:
    put:
      tags: [organizer]
      summary: Bật hoặc tắt định giá động cho một khu vực (FR-22)
      description: Tắt thì đề xuất đang chờ của khu vực chuyển sang `EXPIRED`.
      operationId: setZoneDynamicPricing
      x-feature: [organizer_console, dynamic_pricing]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EventRef'
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Đã lưu
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
        '400':
          description: '`invalid_payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`forbidden` hoặc `not_event_organizer`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`event_not_found`, `zone_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/organizer/suggestions/{id}/approve:
    post:
      tags: [organizer]
      summary: Duyệt một đề xuất giá (FR-22, W-01)
      description: |
        Trong một giao dịch: đặt `base_price` của khu vực bằng giá đề xuất, đổi giá các ghế `AVAILABLE`,
        ghi một dòng `price_changes` có `reason` là `DYNAMIC`, đánh dấu đề xuất `APPROVED`
        và phát thông báo `price_changed` trên luồng SSE.
        Ghế `HELD` và `SOLD` giữ nguyên giá.
        Hai lần duyệt đồng thời chỉ có một lần được áp dụng.
      operationId: approvePriceSuggestion
      x-feature: [organizer_console, dynamic_pricing]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID của đề xuất
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Đã áp dụng giá mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceApproval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`forbidden` hoặc `not_event_organizer`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`suggestion_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `suggestion_not_pending` (đã được duyệt, từ chối hoặc rút lại) hoặc
            `suggestion_stale` (giá hay giá sàn, giá trần của khu vực đã đổi sau khi đề xuất được tạo; đề xuất chuyển sang `EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/organizer/suggestions/{id}/reject:
    post:
      tags: [organizer]
      summary: Từ chối một đề xuất giá (FR-22, W-01)
      description: Đánh dấu đề xuất `REJECTED`. Không giá nào đổi.
      operationId: rejectPriceSuggestion
      x-feature: [organizer_console, dynamic_pricing]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID của đề xuất
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Đã từ chối
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: REJECTED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`forbidden` hoặc `not_event_organizer`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`suggestion_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`suggestion_not_pending`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tickets/cancel:
    post:
      tags: [tickets]
      summary: Hủy ghế hoặc vé của chính người gọi
      description: |
        Nhả các lượt giữ và hủy các vé của người gọi trên những ghế được chọn, rồi ghi một dòng vào `audit_logs`.
        Chỉ có tác dụng khi cờ `payments` bật.
        Ở profile `sprint2` cờ này tắt nên endpoint trả `404 feature_disabled`.
      operationId: cancelTicket
      x-feature: [payments]
      security:
        - sessionCookie: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTicketRequest'
      responses:
        '200':
          description: Đã hủy và ghi nhật ký
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                    enum: [cancelled]
                  auditLogId:
                    type: integer
                    format: int64
                  bookingCode:
                    type: string
                  releasedSeats:
                    type: array
                    items:
                      type: string
                  cancelledAt:
                    type: string
                    format: date-time
                  message:
                    type: string
        '400':
          description: '`invalid_payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FeatureDisabled'

  /api/tickets/cancelled:
    get:
      tags: [tickets]
      summary: Các lần hủy của người gọi
      description: Chỉ có tác dụng khi cờ `payments` bật.
      operationId: listCancelledTickets
      x-feature: [payments]
      security:
        - sessionCookie: []
        - bearer: []
      responses:
        '200':
          description: Danh sách lần hủy, mới nhất trước
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CancelledTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FeatureDisabled'

  /api/tickets/audit-logs:
    get:
      tags: [tickets]
      summary: Nhật ký kiểm toán các sự kiện của Ban Tổ chức
      description: '`ADMIN` thấy toàn bộ nhật ký. Thuộc bảng điều khiển Ban Tổ chức nên dùng cờ `organizer_console`.'
      operationId: listAuditLogs
      x-feature: [organizer_console]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      responses:
        '200':
          description: Các dòng nhật ký gần đây
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FeatureDisabled'

  /api/tickets/reset-demo:
    post:
      tags: [tickets]
      summary: Nhả các lượt giữ của người gọi để chạy lại demo
      description: |
        Chỉ có khi `APP_ENV` khác `production`.
        Ghi một dòng `DEMO_RESET` vào `audit_logs`, không xóa nhật ký cũ.
      operationId: resetDemoTickets
      x-environment: non-production
      x-feature: [seat_hold]
      security:
        - sessionCookie: []
        - bearer: []
      responses:
        '200':
          description: Đã nhả các lượt giữ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`feature_disabled`, hoặc không có endpoint này khi `APP_ENV=production`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tickets:
    get:
      tags: [tickets]
      summary: Vé đã phát hành của người gọi
      description: |
        Chỉ gồm vé chưa `VOID`, sắp theo giờ diễn.
        Vé chỉ được phát hành khi IPN của VNPay báo thanh toán thành công.
        `price` là giá ghế, chưa gồm phí dịch vụ.
      operationId: listMyTickets
      x-feature: [payments]
      security:
        - sessionCookie: []
        - bearer: []
      responses:
        '200':
          description: Danh sách vé
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FeatureDisabled'

  /api/assistant/chat:
    post:
      tags: [assistant]
      summary: Hỏi trợ lý (FR-24)
      description: |
        Trả lời câu hỏi về lịch diễn, giá vé, ghế còn trống, cách đặt vé, ghế đang giữ, vé đã mua và doanh số.
        Không cần đăng nhập. Vai trò lấy từ phiên trên server, không đọc từ body.
        Người chưa đăng nhập chỉ nhận thông tin công khai.
        `my_holds` và `my_tickets` chỉ trả dữ liệu của người gọi.
        `organizer_sales` chỉ dành cho `ORGANIZER` (sự kiện của mình) và `ADMIN` (mọi sự kiện).
        Mô hình ngôn ngữ chỉ phân loại câu hỏi. Số liệu và câu trả lời luôn do server dựng từ PostgreSQL.
        Khi mô hình tắt, quá 8 giây hoặc trả sai định dạng, server phân loại bằng từ khóa và `mode` là `fallback`.
        Giới hạn 20 yêu cầu mỗi phút cho mỗi tài khoản (hoặc mỗi địa chỉ nếu chưa đăng nhập), 60 yêu cầu mỗi phút cho mỗi địa chỉ.
        Luồng đầy đủ nằm ở `docs/assistant.md`.
      operationId: assistantChat
      x-feature: [chatbot]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantRequest'
      responses:
        '200':
          description: Câu trả lời
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantReply'
        '400':
          description: '`invalid_payload` (JSON sai hoặc body quá 4 KB) hoặc `empty_message`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/payments/vnpay/create:
    post:
      tags: [payments]
      summary: Tạo đơn từ các ghế đang giữ và lấy URL thanh toán VNPay
      description: |
        Server tự tính tiền từ `event_seats.current_price` của các lượt giữ còn hạn, cộng phí dịch vụ 3%.
        Đơn `PENDING` cũ của người gọi cho sự kiện này được dùng lại nếu đúng bộ lượt giữ hiện tại, nếu không thì bị hủy.
        Mỗi lần gọi tạo một lần thanh toán mới (`vnp_TxnRef` mới).
        Đơn hết hạn cùng lúc với lượt giữ sớm nhất. Cần còn ít nhất 60 giây.
        Luồng đầy đủ nằm ở `docs/payments.md`.
      operationId: createVNPayPayment
      x-feature: [payments]
      security:
        - sessionCookie: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties:
                eventId:
                  type: string
                  description: UUID hoặc slug của sự kiện
      responses:
        '201':
          description: Đơn và URL VNPay đã ký. Frontend chuyển trình duyệt sang `paymentUrl`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
        '400':
          description: '`invalid_payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`event_not_found`, hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `no_active_holds`: không có lượt giữ còn hạn.
            `holds_expiring`: lượt giữ còn dưới 60 giây.
            `event_not_on_sale`: sự kiện không mở bán.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/payments/vnpay/ipn:
    get:
      tags: [payments]
      summary: IPN của VNPay (server gọi server)
      description: |
        Chỉ VNPay gọi, không dùng phiên đăng nhập. Chữ ký `vnp_SecureHash` (HMAC-SHA512) là cách xác thực.
        Đây là nơi duy nhất đổi đơn sang `PAID`, bán ghế và phát hành vé. Gọi lặp lại an toàn.
        Luôn trả HTTP 200, VNPay chỉ đọc `RspCode`.
        Ngoài các tham số dưới đây, VNPay còn gửi `vnp_BankTranNo`, `vnp_CardType`, `vnp_PayDate`, và nằm trong phần được ký.
      operationId: vnpayIpn
      x-feature: [payments]
      parameters:
        - $ref: '#/components/parameters/VnpAmount'
        - $ref: '#/components/parameters/VnpTmnCode'
        - $ref: '#/components/parameters/VnpTxnRef'
        - name: vnp_ResponseCode
          in: query
          required: true
          schema:
            type: string
          description: '`00` là thành công'
        - name: vnp_TransactionStatus
          in: query
          required: true
          schema:
            type: string
          description: '`00` là thành công'
        - name: vnp_TransactionNo
          in: query
          required: true
          schema:
            type: string
          description: Mã giao dịch của VNPay, lưu vào `payments.provider_txn_id`
        - $ref: '#/components/parameters/VnpSecureHash'
      responses:
        '200':
          description: |
            `00` Confirm Success. `01` Order not found. `02` Order already confirmed.
            `04` Invalid amount. `97` Invalid signature. `99` Unknown error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VNPayIpnResponse'
        '404':
          $ref: '#/components/responses/FeatureDisabled'

  /api/payments/vnpay/return:
    get:
      tags: [payments]
      summary: Kiểm tra chữ ký của return URL và đọc trạng thái thanh toán
      description: |
        Trang `/payment/vnpay/return` của frontend gửi nguyên query string VNPay đã chuyển về.
        Endpoint chỉ đọc, không đổi trạng thái. Không cần phiên đăng nhập, chữ ký là cách xác thực.
      operationId: vnpayReturn
      x-feature: [payments]
      parameters:
        - $ref: '#/components/parameters/VnpAmount'
        - $ref: '#/components/parameters/VnpTmnCode'
        - $ref: '#/components/parameters/VnpTxnRef'
        - $ref: '#/components/parameters/VnpSecureHash'
      responses:
        '200':
          description: Trạng thái ghi nhận từ IPN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOutcome'
        '400':
          description: '`invalid_signature`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`payment_not_found`, hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/feedback:
    post:
      tags: [feedback]
      summary: Gửi phản hồi kiểm thử với người dùng (thang SUS, các bước đã làm, góp ý)
      description: |
        Không cần đăng nhập. Mỗi IP gửi tối đa 20 lần mỗi giờ, quá thì trả `429 rate_limited`.
        Mười câu SUS bắt buộc, mỗi câu từ 1 đến 5. Thời gian từng bước (giây) và góp ý có thể bỏ trống.
        Server không lưu IP và không gắn phản hồi với tài khoản.
      operationId: submitFeedback
      x-feature: [user_testing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackInput'
      responses:
        '201':
          description: Đã lưu
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  susScore:
                    type: number
                    description: Điểm SUS của phản hồi, từ 0 đến 100
        '400':
          description: '`invalid_payload`, hoặc `invalid_feedback` kèm trường `field` là tên trường sai'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          $ref: '#/components/responses/Error'

  /api/feedback/summary:
    get:
      tags: [feedback]
      summary: Tổng hợp kết quả khảo sát (điểm SUS, tỷ lệ hoàn thành, góp ý gần đây)
      operationId: feedbackSummary
      x-feature: [user_testing]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      responses:
        '200':
          description: Chưa có phản hồi nào thì `sus` là `null` và `itemMeans` rỗng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FeatureDisabled'

  /api/feedback/export.csv:
    get:
      tags: [feedback]
      summary: Tải toàn bộ phản hồi dạng CSV (UTF-8 có BOM)
      operationId: feedbackExport
      x-feature: [user_testing]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      responses:
        '200':
          description: Mỗi dòng là một phản hồi, kèm cột `sus_score`
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FeatureDisabled'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_token
    bearer:
      type: http
      scheme: bearer

  parameters:
    VnpAmount:
      name: vnp_Amount
      in: query
      required: true
      schema:
        type: string
      description: Số tiền VND nhân 100
    VnpTmnCode:
      name: vnp_TmnCode
      in: query
      required: true
      schema:
        type: string
    VnpTxnRef:
      name: vnp_TxnRef
      in: query
      required: true
      schema:
        type: string
      description: '`payments.payment_code`, khác nhau cho mỗi lần thanh toán'
    VnpSecureHash:
      name: vnp_SecureHash
      in: query
      required: true
      schema:
        type: string
      description: HMAC-SHA512 (hex) của các tham số `vnp_*` đã sắp xếp và mã hóa URL
    EventRef:
      name: id
      in: path
      required: true
      description: UUID hoặc slug của sự kiện
      schema:
        type: string

  responses:
    Error:
      description: Lỗi, mã nằm trong trường `error`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: '`unauthorized`: chưa đăng nhập, phiên hết hạn hoặc tài khoản không còn `ACTIVE`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`forbidden`: vai trò không được phép'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FeatureDisabled:
      description: '`feature_disabled`: cờ tính năng đang tắt'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    FeedbackInput:
      type: object
      required: [testerRole, sus]
      properties:
        testerRole:
          type: string
          enum: [AUDIENCE, ORGANIZER]
        testerName:
          type: string
          maxLength: 100
        device:
          type: string
          enum: ['', PHONE, TABLET, LAPTOP]
        sus:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: integer
            minimum: 1
            maximum: 5
        tasks:
          type: object
          properties:
            login: {type: boolean}
            hold: {type: boolean}
            pay: {type: boolean}
            ticket: {type: boolean}
        timesSec:
          type: object
          description: Số giây từng bước, từ 0 đến 3600, hoặc `null`
          properties:
            login: {type: integer, nullable: true}
            hold: {type: integer, nullable: true}
            pay: {type: integer, nullable: true}
            ticket: {type: integer, nullable: true}
        comment:
          type: string
          maxLength: 2000
    FeedbackSummary:
      type: object
      properties:
        count:
          type: integer
        byRole:
          type: object
          additionalProperties:
            type: integer
        sus:
          nullable: true
          type: object
          properties:
            mean: {type: number}
            median: {type: number}
            min: {type: number}
            max: {type: number}
        itemMeans:
          type: array
          items:
            type: number
        tasks:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                enum: [login, hold, pay, ticket]
              done: {type: integer}
              total: {type: integer}
              rate: {type: number}
              timedCount: {type: integer}
              meanSeconds: {type: number, nullable: true}
        recent:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              createdAt: {type: string, format: date-time}
              testerRole: {type: string}
              testerName: {type: string}
              score: {type: number}
              comment: {type: string}
    OtpAppPhone:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: '+84912345678'
          description: Chuẩn hóa như `destination`. Email bị từ chối với `invalid_destination`.

    Checkout:
      type: object
      required: [orderId, orderCode, subtotal, serviceFee, total, expiresAt, paymentUrl]
      properties:
        orderId:
          type: string
          format: uuid
        orderCode:
          type: string
          example: ETYQTZXY3F
        subtotal:
          type: integer
          format: int64
          description: Tổng giá ghế, VND
        serviceFee:
          type: integer
          format: int64
          description: Phí dịch vụ 3% của `subtotal`, làm tròn đến đồng
        total:
          type: integer
          format: int64
          description: '`subtotal + serviceFee`, số tiền khách trả (VND)'
        expiresAt:
          type: string
          format: date-time
          description: Bằng giờ hết hạn của lượt giữ sớm nhất, cũng là `vnp_ExpireDate`
        paymentUrl:
          type: string
          format: uri
          description: URL `vpcpay.html` đã ký

    VNPayIpnResponse:
      type: object
      required: [RspCode, Message]
      properties:
        RspCode:
          type: string
          enum: ['00', '01', '02', '04', '97', '99']
        Message:
          type: string
          example: Confirm Success

    PaymentOutcome:
      type: object
      required: [status, orderCode, eventId, amount, ticketCount, responseCode]
      properties:
        status:
          type: string
          enum: [paid, processing, failed, refund_pending]
          description: |
            `paid`: IPN đã xác nhận, vé đã phát hành.
            `processing`: VNPay báo thành công nhưng IPN chưa tới.
            `failed`: thất bại hoặc khách hủy.
            `refund_pending`: tiền đã vào nhưng không phát hành được vé, cần hoàn tiền.
        orderCode:
          type: string
        eventId:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: VND
        ticketCount:
          type: integer
        responseCode:
          type: string
          description: '`vnp_ResponseCode` trong return URL. `00` là thành công'

    MyTicket:
      type: object
      required: [id, ticketCode, status, issuedAt, orderCode, eventId, eventSlug, eventName, startsAt, venueName, seatLabel, zoneName, price]
      properties:
        id:
          type: string
          format: uuid
        ticketCode:
          type: string
        status:
          type: string
          enum: [ISSUED, ACTIVE, USED, REVOKED]
        issuedAt:
          type: string
          format: date-time
        orderCode:
          type: string
        eventId:
          type: string
          format: uuid
        eventSlug:
          type: string
        eventName:
          type: string
        startsAt:
          type: string
          format: date-time
        venueName:
          type: string
        imageUrl:
          type: string
          description: Ảnh sự kiện, có thể vắng
        imageCredit:
          type: string
          description: Ghi công tác giả ảnh, hiện cạnh ảnh
        seatLabel:
          type: string
        zoneName:
          type: string
        price:
          type: integer
          format: int64
          description: Giá ghế, chưa gồm phí dịch vụ (VND)

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: seat_not_available
        feature:
          type: string
          description: Chỉ có khi `error = feature_disabled`
          example: seat_hold

    User:
      type: object
      required: [id, phone, email, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          description: Chuỗi rỗng nếu chưa có
        email:
          type: string
          description: Chuỗi rỗng nếu chưa có
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    UserRole:
      type: string
      enum: [CUSTOMER, ORGANIZER, CEO, GATE_STAFF, ADMIN]

    EventStatus:
      type: string
      enum: [DRAFT, ON_SALE, SOLD_OUT, PAUSED, ENDED, CANCELLED]

    EventSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        genre:
          type: string
        city:
          type: string
        imageUrl:
          type: string
        imageCredit:
          type: string
        venue:
          type: string
        address:
          type: string
        date:
          type: string
          format: date-time
          description: Giờ bắt đầu
        endsAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EventStatus'
        priceFrom:
          type: integer
          format: int64
          description: Giá cơ bản thấp nhất trong các khu vực, VND

    EventDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        genre:
          type: string
        imageUrl:
          type: string
        imageCredit:
          type: string
        city:
          type: string
        venueName:
          type: string
        venueAddress:
          type: string
        venueTimezone:
          type: string
          example: Asia/Ho_Chi_Minh
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EventStatus'
        maxTicketsPerUser:
          type: integer
        waitingRoomEnabled:
          type: boolean
        zones:
          type: array
          items:
            $ref: '#/components/schemas/EventZonePrice'

    EventZonePrice:
      type: object
      properties:
        zoneId:
          type: string
          format: uuid
        zoneCode:
          type: string
        zoneName:
          type: string
        floor:
          type: string
        capacity:
          type: integer
        basePrice:
          type: integer
          format: int64
        floorPrice:
          type: integer
          format: int64
        ceilingPrice:
          type: integer
          format: int64
        isDynamicPricingEnabled:
          type: boolean
        recentChange:
          $ref: '#/components/schemas/PriceTrend'

    PriceTrend:
      type: object
      description: Lần đổi giá gần nhất của khu vực. Chỉ có khi lần đổi đó cách đây không quá 30 phút.
      properties:
        oldPrice:
          type: integer
          format: int64
        newPrice:
          type: integer
          format: int64
        changedAt:
          type: string
          format: date-time

    PriceChanged:
      type: object
      description: Dữ liệu của sự kiện SSE `update` khi giá một khu vực đổi.
      properties:
        type:
          type: string
          enum: [price_changed]
        eventId:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        oldPrice:
          type: integer
          format: int64
        newPrice:
          type: integer
          format: int64
        reason:
          type: string
          enum: [DYNAMIC, MANUAL]
        timestamp:
          type: string
          format: date-time

    ZoneInputs:
      type: object
      description: Số liệu đầu vào của một lần phân tích, xem `docs/dynamic-pricing.md` mục 3 và 4.
      properties:
        velocityActual:
          type: number
          description: Ghế bị giữ hoặc bán mỗi phút trong cửa sổ
        velocityTarget:
          type: number
          description: Ghế cần bán mỗi phút để hết trước giờ đóng bán
        velocityRatio:
          type: number
        demandSeats:
          type: integer
        windowMinutes:
          type: integer
        minutesLeft:
          type: number
        remaining:
          type: integer
          description: Ghế chưa bán (`AVAILABLE` và `HELD`)
        held:
          type: integer
        sold:
          type: integer
        total:
          type: integer
        heldRatio:
          type: number
        fillRate:
          type: number
          description: '`sold / total`, chỉ để hiển thị'
        queue:
          type: integer
        alpha:
          type: number
        delta:
          type: number
          description: Tỉ lệ điều chỉnh giá đã chặn ±20%, ví dụ `0.18` là +18%

    PriceSuggestion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        currentPrice:
          type: integer
          format: int64
        suggestedPrice:
          type: integer
          format: int64
        changePercent:
          type: number
        reason:
          type: string
        inputs:
          $ref: '#/components/schemas/ZoneInputs'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PricePreview:
      type: object
      description: Điều mà tác vụ sẽ đề xuất từ số liệu ngay lúc này.
      properties:
        suggestedPrice:
          type: integer
          format: int64
        changePercent:
          type: number
        significant:
          type: boolean
          description: '`true` khi mức đổi từ 5% trở lên, tức là sẽ thành đề xuất'

    PricePoint:
      type: object
      description: Một dòng `price_changes`
      properties:
        at:
          type: string
          format: date-time
        oldPrice:
          type: integer
          format: int64
        newPrice:
          type: integer
          format: int64
        reason:
          type: string
          example: DYNAMIC

    ZonePricingState:
      type: object
      properties:
        zoneId:
          type: string
          format: uuid
        zoneCode:
          type: string
        zoneName:
          type: string
        floor:
          type: string
        capacity:
          type: integer
        basePrice:
          type: integer
          format: int64
        floorPrice:
          type: integer
          format: int64
        ceilingPrice:
          type: integer
          format: int64
        isDynamicPricingEnabled:
          type: boolean
        analysis:
          type: string
          enum: [ok, sold_out, sales_closed]
          description: '`inputs` và `preview` chỉ có khi là `ok`'
        inputs:
          allOf:
            - $ref: '#/components/schemas/ZoneInputs'
          nullable: true
        preview:
          allOf:
            - $ref: '#/components/schemas/PricePreview'
          nullable: true
        pending:
          allOf:
            - $ref: '#/components/schemas/PriceSuggestion'
          nullable: true
        history:
          type: array
          description: Tối đa 12 lần đổi giá gần nhất, cũ trước mới sau
          items:
            $ref: '#/components/schemas/PricePoint'

    PricingSettings:
      type: object
      properties:
        intervalSeconds:
          type: integer
        windowMinutes:
          type: integer
        targetHorizonMinutes:
          type: integer
          description: '`0` là không chặn'
        minChangePercent:
          type: number
        maxStepPercent:
          type: number
        roundTo:
          type: integer
          format: int64

    PricingOverview:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        lastRunAt:
          type: string
          format: date-time
          nullable: true
          description: Lần phân tích gần nhất của tiến trình api này
        settings:
          $ref: '#/components/schemas/PricingSettings'
        zones:
          type: array
          items:
            $ref: '#/components/schemas/ZonePricingState'

    PricingRunSummary:
      type: object
      properties:
        zones:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        withdrawn:
          type: integer

    PriceApproval:
      type: object
      properties:
        suggestionId:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        oldPrice:
          type: integer
          format: int64
        newPrice:
          type: integer
          format: int64
        repricedSeats:
          type: integer
          format: int64
          description: Số ghế `AVAILABLE` đã đổi giá

    SeatMapItem:
      type: object
      properties:
        eventSeatId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        seatId:
          type: string
          format: uuid
        status:
          type: string
          enum: [available, held, sold, selected]
          description: '`selected` là ghế người gọi đang giữ'
        currentPrice:
          type: integer
          format: int64
        row:
          type: string
        number:
          type: string
        label:
          type: string
        x:
          type: number
        y:
          type: number
        zoneId:
          type: string
          format: uuid
        zoneCode:
          type: string
        zoneName:
          type: string
        isMyHold:
          type: boolean

    SeatHold:
      type: object
      required: [holdId, holdToken, seatId, eventId, expiresAt]
      properties:
        holdId:
          type: string
          format: uuid
        holdToken:
          type: string
        seatId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: Giờ hết hạn theo server, dùng cho đồng hồ đếm ngược

    SeatUpdate:
      description: Nội dung `data` của sự kiện SSE `update`
      type: object
      properties:
        type:
          type: string
          enum: [seat_held, seat_released, seat_expired]
        eventId:
          type: string
          format: uuid
        seatId:
          type: string
          format: uuid
        status:
          type: string
          enum: [AVAILABLE, HELD, SOLD]
        timestamp:
          type: string
          format: date-time

    OrganizerEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          $ref: '#/components/schemas/EventStatus'
        startsAt:
          type: string
          format: date-time
        imageUrl:
          type: string
        venueName:
          type: string

    ZonePricing:
      type: object
      required: [basePrice, floorPrice, ceilingPrice]
      properties:
        basePrice:
          type: integer
          format: int64
          description: VND
        floorPrice:
          type: integer
          format: int64
        ceilingPrice:
          type: integer
          format: int64

    CancelTicketRequest:
      type: object
      properties:
        bookingId:
          type: string
        bookingCode:
          type: string
        eventId:
          type: string
          description: UUID hoặc slug của sự kiện
        reason:
          type: string
        seats:
          type: array
          items:
            type: string
          description: Nhãn hoặc UUID của các ghế cần hủy
        concert:
          type: object
          additionalProperties: true
          description: Dữ liệu hiển thị do client gửi, lưu nguyên
        ticketDetails:
          type: object
          additionalProperties: true
          description: Dữ liệu hiển thị do client gửi, lưu nguyên

    CancelledTicket:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bookingId:
          type: string
        bookingCode:
          type: string
        eventId:
          type: string
        eventTitle:
          type: string
        seats:
          type: array
          items:
            type: string
        releasedSeats:
          type: array
          items:
            type: string
        reason:
          type: string
        cancelledAt:
          type: string
          format: date-time
        userEmail:
          type: string

    AuditLogItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        action:
          type: string
        entityType:
          type: string
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
        actorEmail:
          type: string
        eventName:
          type: string
        oldData:
          type: object
          additionalProperties: true
        newData:
          type: object
          additionalProperties: true

    AssistantRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 300
          description: Câu hỏi, cắt ở 300 ký tự
          example: Concert Mỹ Tâm còn vé khu nào?
        context:
          type: object
          properties:
            event:
              type: string
              description: UUID hoặc slug của sự kiện trang đang mở, dùng khi câu hỏi không nêu tên sự kiện
    AssistantReply:
      type: object
      required: [reply, intent, mode, links, suggestions]
      properties:
        reply:
          type: string
          description: Văn bản thuần, xuống dòng bằng `\n`
        intent:
          type: string
          enum: [list_events, event_info, prices, availability, how_to_book, my_holds, my_tickets, organizer_sales, greeting, unknown]
        mode:
          type: string
          enum: [llm, fallback]
          description: '`llm` khi mô hình đọc được câu hỏi, `fallback` khi dùng từ khóa'
        links:
          type: array
          items:
            type: object
            required: [label, url]
            properties:
              label:
                type: string
              url:
                type: string
                description: Đường dẫn trong ứng dụng, ví dụ `/events/{id}/tickets`
        suggestions:
          type: array
          items:
            type: string
          description: Câu hỏi gợi ý tiếp theo
