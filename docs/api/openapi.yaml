          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`event_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/organizer/suggestions/{id}/approve:
    post:
      tags: [pricing]
      summary: Duyệt đề xuất giá (FR-22, W-01)
      description: |
        Giá cơ bản của khu vực đổi sang giá đề xuất.
        Mọi ghế `AVAILABLE` trong khu vực nhận giá mới, ghế `HELD` giữ giá cũ.
        Một dòng `SUGGESTION` được ghi vào `price_changes`, kèm lý do của đề xuất.
        Luồng SSE gửi `zone_repriced`.
        Trả `409 suggestion_stale` khi giá cơ bản đã đổi sau lúc tạo đề xuất,
        hoặc khi giá đề xuất nằm ngoài giá sàn, giá trần hiện tại.
      operationId: approvePriceSuggestion
      x-feature: [organizer_console, dynamic_pricing]
      x-roles: [ORGANIZER, ADMIN]
      security:
        - sessionCookie: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/SuggestionId'
      responses:
        '200':
          description: Đã duyệt, kèm giá cơ bản mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewedSuggestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`forbidden` hoặc `not_event_organizer`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`suggestion_not_found`, `zone_not_found` hoặc `feature_disabled`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`suggestion_not_pending` hoặc `suggestion_stale`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/organizer/suggestions/{id}/reject:
