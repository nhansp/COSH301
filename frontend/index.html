    <meta property="og:title" content="SortMyScene - Concert &amp; Music Event Ticketing" />

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="color-scheme" content="light dark" />
    <script>
      // Resolve the stored theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var pref = localStorage.getItem('theme');
          var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
